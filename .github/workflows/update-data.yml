name: Aggiorna dati scuole

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install -r requirements.txt
          pip install pytest

      - name: Verifica sintassi frontend
        run: node --check docs/js/app.js

      - name: Esegui i test
        run: PYTHONPATH=. python -m pytest tests/

      - name: Esegue pipeline completa
        run: python run_pipeline.py

      - name: Committa i dati aggiornati (se cambiati)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: aggiornamento automatico dati scuole"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push fallito al tentativo $attempt, nuovo tentativo..."
          done

          echo "ERRORE: impossibile sincronizzare e pubblicare main dopo 3 tentativi."
          exit 1
